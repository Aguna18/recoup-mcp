name: Publish to MCP Registry

on:
  # Manual only: the server URL is already listed under its domain name, and the
  # registry refuses a second name for the same URL ("remote URL ... is already used").
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # GitHub OIDC login to the registry, no stored token
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: |
          # The registry's reply is turned into an annotation so it is readable on the public run page.
          set +e
          out=$(./mcp-publisher publish 2>&1); code=$?
          echo "$out"
          if [ $code -ne 0 ]; then echo "::error title=publish failed::$(echo "$out" | tr '\n' ' ' | cut -c1-900)"; fi
          exit $code
